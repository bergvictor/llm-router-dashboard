<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#eceff4">
<meta name="robots" content="noindex, nofollow">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>LLM Router — Call detail</title>
<!-- Link-preview card — see the note in index.html. Deliberately the GENERIC card and description:
     a detail URL names one recorded call, and its preview must not leak that call's caller, task or
     prompt into a chat client's unfurl. -->
<meta property="og:type" content="website">
<meta property="og:url" content="https://llm-router-dashboard.pages.dev/detail">
<meta property="og:title" content="LLM Router — Call detail">
<meta property="og:description" content="Single-call detail view for the LLM Router dashboard.">
<meta property="og:image" content="https://llm-router-dashboard.pages.dev/og.png">
<meta name="twitter:card" content="summary_large_image">
<!-- Light mode only: one palette, no toggle, no stored theme. -->
<style>
  /* ---- light palette: the subset of index.html's palette this page uses, values copied
         verbatim from it so the three pages cannot drift. Every rule below reads var(--…). ---- */
  :root{
    --bg:#eceff4;--card:#ffffff;--card2:#f5f7fa;--line:#dbe0e8;--line-strong:#b6bfcd;
    --fg:#0f172a;--dim:#5b6675;
    --ok:#0f7a37;--warn:#b45309;--bad:#c22323;--acc:#4f46e5;--cloud:#6d28d9;--local:#0f766e;
    --cloud-bg:#f0eafd;--local-bg:#dff2f0;
    --hdr-bg:linear-gradient(180deg,#ffffffef,#f7f9fcf2);
    --logo-a:#4f46e5;--logo-b:#7c3aed;
    color-scheme:light;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.5 -apple-system,Segoe UI,Roboto,system-ui,sans-serif}
  header{display:flex;align-items:center;gap:14px;padding:14px 20px;border-bottom:1px solid var(--line);
         padding-top:max(14px,env(safe-area-inset-top));position:sticky;top:0;
         background:var(--hdr-bg);backdrop-filter:blur(12px);z-index:6;flex-wrap:wrap}
  h1{font-size:16px;margin:0;font-weight:650}
  /* brandmark — same tile and glyph as index.html / monitor.html, and the same --logo-*
     stops, which match the favicon gradient exactly. */
  .brand{display:inline-flex;align-items:center;gap:11px;min-width:0}
  .logo{flex:none;width:32px;height:32px;border-radius:9px;display:inline-flex;align-items:center;justify-content:center;
        background:linear-gradient(140deg,var(--logo-a),var(--logo-b));color:#fff;
        box-shadow:0 1px 2px rgba(15,23,42,.25),inset 0 1px 0 rgba(255,255,255,.22)}
  .muted{color:var(--dim)}
  .right{margin-left:auto;display:flex;gap:10px;align-items:center}
  a.nav{color:var(--acc);text-decoration:none;font-size:12.5px;font-weight:600;min-height:44px;display:inline-flex;align-items:center;padding:0 10px}
  a.nav:hover{text-decoration:underline}
  .wrap{padding:18px 20px;max-width:1100px;margin:0 auto}
  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px 18px;margin-bottom:14px}
  .card h2{font-size:11px;text-transform:uppercase;letter-spacing:.09em;color:var(--dim);margin:0 0 10px;
           display:flex;align-items:center;gap:10px}
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px 20px}
  .f{display:flex;flex-direction:column;gap:3px;min-width:0}
  .k{font-size:10px;text-transform:uppercase;letter-spacing:.05em;color:var(--dim)}
  .v{font-size:13.5px;font-variant-numeric:tabular-nums;word-break:break-word}
  /* the two body panes sit ON a card, so they take the recessed surface token (--card2), the same
     one .copy uses. */
  pre{white-space:pre-wrap;word-break:break-word;background:var(--card2);border:1px solid var(--line);
      border-radius:10px;padding:14px 16px;font:12.5px/1.55 ui-monospace,Consolas,monospace;
      color:var(--fg);margin:0;max-height:60vh;overflow:auto}
  .badge{display:inline-block;padding:2px 9px;border-radius:999px;font-size:11px;font-weight:600}
  .b-cloud{background:var(--cloud-bg);color:var(--cloud)} .b-local{background:var(--local-bg);color:var(--local)}
  .copy{margin-left:auto;background:var(--card2);border:1px solid var(--line);color:var(--dim);
        border-radius:8px;padding:3px 12px;min-height:40px;font:inherit;font-size:11.5px;font-weight:600;cursor:pointer}
  .copy:hover{border-color:var(--acc);color:var(--fg)}
  .empty{color:var(--dim);text-align:center;padding:60px 10px;font-size:14px;line-height:1.7}
  .lenNote{font-size:11px;color:var(--dim);text-transform:none;letter-spacing:0;font-weight:400}
  #copyStatus{position:fixed;left:50%;bottom:max(18px,env(safe-area-inset-bottom));transform:translateX(-50%);
              background:var(--card);border:1px solid var(--acc);border-radius:999px;padding:8px 14px;font-size:12px;
              opacity:0;pointer-events:none;transition:opacity .15s;z-index:10}
  #copyStatus.show{opacity:1}
  a:focus-visible,button:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
  @media (max-width:640px), (max-width:900px) and (hover:none){
    header{padding:8px 12px;padding-top:max(8px,env(safe-area-inset-top));
           padding-left:max(12px,env(safe-area-inset-left));padding-right:max(12px,env(safe-area-inset-right));gap:8px}
    header h1{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:65vw}
    .wrap{padding:12px max(12px,env(safe-area-inset-right)) 12px max(12px,env(safe-area-inset-left))}
    .card{padding:12px;margin-bottom:10px;border-radius:10px}
    .grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:11px 12px}
    .v{font-size:12.5px}
    .card h2{flex-wrap:wrap;min-height:40px;margin-bottom:8px}
    .copy{min-height:44px;padding:6px 14px}
    pre{font-size:12px;padding:12px;max-height:52svh;overscroll-behavior:contain}
    .empty{text-align:left;padding:30px 8px}
  }
  @media(prefers-reduced-motion:reduce){#copyStatus{transition:none}}
</style>
</head>
<body>
<header>
  <span class="brand">
    <span class="logo" aria-hidden="true">
      <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M8 11 5.6 5"/><path d="M16 11l2.4-6"/>
        <rect x="2.6" y="11" width="18.8" height="8" rx="2.4"/>
        <circle cx="6.2" cy="15" r="0.85" fill="currentColor" stroke="none"/>
        <circle cx="8.9" cy="15" r="0.85" fill="currentColor" stroke="none"/>
        <circle cx="11.6" cy="15" r="0.85" fill="currentColor" stroke="none"/>
        <circle cx="14.3" cy="15" r="0.85" fill="currentColor" stroke="none"/>
        <circle cx="18.2" cy="15" r="0.85" fill="currentColor" stroke="none"/>
      </svg>
    </span>
    <h1>Call detail <span class="muted" id="hdrId" style="font-weight:400"></span></h1>
  </span>
  <div class="right">
    <a class="nav" href="monitor.html">← back to Monitor</a>
  </div>
</header>
<div class="wrap" id="main">
  <div class="empty">loading…</div>
</div>
<div id="copyStatus" role="status" aria-live="polite"></div>
<script>
const $=s=>document.querySelector(s);
const LOCAL="http://127.0.0.1:11435";
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const PROVIDER_NAMES={google:'Google',mistral:'Mistral',groq:'Groq',cerebras:'Cerebras',cloudflare:'Cloudflare',
  github:'GitHub',nvidia:'NVIDIA',cohere:'Cohere',zai:'Z.ai','ollama-cloud':'Ollama Cloud',huggingface:'HuggingFace',
  openrouter:'OpenRouter',sambanova:'SambaNova',modelscope:'ModelScope',ovh:'OVH',kilo:'Kilo',llm7:'LLM7',
  lightning:'Lightning',prism:'Prism',euri:'EURI',llmrack:'LLMRack',freeai:'Free.ai',fullai:'FullAI',
  bytez:'Bytez',aihorde:'AI Horde',pollinations:'Pollinations',opencode:'OpenCode',sealion:'SEA-LION'};
function providerName(p){if(!p)return'';const k=String(p).toLowerCase();return PROVIDER_NAMES[k]||p;}
function fmtLatency(ms){if(ms==null||isNaN(+ms))return"–";ms=+ms;return ms<1000?ms+"ms":(ms/1000).toFixed(ms<10000?1:0)+"s";}
function fmtFull(t){if(t==null||isNaN(+t))return"–";const d=new Date((+t)*1000);const p=n=>String(n).padStart(2,'0');
  return d.getFullYear()+"-"+p(d.getMonth()+1)+"-"+p(d.getDate())+" "+p(d.getHours())+":"+p(d.getMinutes())+":"+p(d.getSeconds());}

async function load(){
  const id=new URLSearchParams(location.search).get("id");
  $('#hdrId').textContent=id?('· #'+id):'';
  if(!id){ $('#main').innerHTML='<div class="empty">no call id given — open this page from a ↗ link on the Monitor.</div>'; return; }
  if(!/^\d+$/.test(id)){ $('#main').innerHTML='<div class="empty">invalid call id</div>'; return; }
  let c;
  try{
    const r=await fetch(LOCAL+"/history?id="+encodeURIComponent(id),{cache:"no-store",
      signal:(typeof AbortSignal!=='undefined'&&AbortSignal.timeout)?AbortSignal.timeout(8000):undefined});
    c=await r.json();
    if(!r.ok) throw new Error(c&&c.error||r.status);
  }catch(e){
    $('#main').innerHTML='<div class="empty">could not load call #'+esc(id)+' from the router at 127.0.0.1:11435.<br>'+
      'Full query &amp; output details are stored ONLY on the router machine — open this page there.<br>'+
      '<span class="muted">('+esc(e.message||e)+')</span></div>';
    return;
  }
  const isCloud=String(c.node).toLowerCase()==="cloud";
  const prompt=typeof c.prompt==='string'?c.prompt:(c.prompt==null?'':JSON.stringify(c.prompt,null,2));
  const output=typeof c.output==='string'?c.output:(c.output==null?'':JSON.stringify(c.output,null,2));
  const f=(k,v)=>`<div class="f"><span class="k">${k}</span><span class="v">${v}</span></div>`;
  const src=isCloud?(providerName(c.pool)||'cloud'):'local GPU ('+esc(c.node||'?')+')';
  $('#main').innerHTML=`
    <div class="card"><h2>What / where / how</h2><div class="grid">
      ${f('When', esc(c.iso||fmtFull(c.t)))}
      ${f('Caller', esc(c.caller||'–'))}
      ${f('Task', esc(c.task||'–'))}
      ${f('Requested model', esc(c.requested||'–'))}
      ${f('Served model', esc(c.model||'–'))}
      ${f('Source', '<span class="badge '+(isCloud?'b-cloud':'b-local')+'">'+esc(src)+'</span>')}
      ${f('Mode', esc(c.mode||'–'))}
      ${f('Endpoint', esc(c.path||'–'))}
      ${f('Status', esc(String(c.status==null?'–':c.status)))}
      ${f('Latency', esc(fmtLatency(c.ms)))}
      ${f('Cost', (Number.isFinite(Number(c.cost))&&Number(c.cost)>0? '$'+Number(c.cost).toFixed(5) : '$0 (free)'))}
      ${f('History id', '#'+esc(c.id))}
    </div></div>
    <div class="card"><h2>Exact query <span class="lenNote">${prompt.length.toLocaleString()} chars</span>
      <button class="copy" data-t="prompt" aria-label="Copy exact query">copy</button></h2>
      <pre id="prompt">${esc(prompt||'— not captured —')}</pre></div>
    <div class="card"><h2>Exact output <span class="lenNote">${output.length.toLocaleString()} chars</span>
      <button class="copy" data-t="output" aria-label="Copy exact output">copy</button></h2>
      <pre id="output">${esc(output||'— not captured —')}</pre></div>`;
  document.querySelectorAll('.copy').forEach(b=>b.addEventListener('click',async()=>{
    const text=document.getElementById(b.getAttribute('data-t')).textContent;
    try{
      if(!navigator.clipboard||!navigator.clipboard.writeText)throw new Error('clipboard unavailable');
      await navigator.clipboard.writeText(text);showCopyStatus('Copied to clipboard');
      b.textContent='copied ✓';setTimeout(()=>b.textContent='copy',1200);
    }catch(e){showCopyStatus('Copy failed — select the text manually');}
  }));
}
let copyStatusTimer=null;
function showCopyStatus(message){
  const el=$('#copyStatus');el.textContent=message;el.classList.add('show');clearTimeout(copyStatusTimer);
  copyStatusTimer=setTimeout(()=>el.classList.remove('show'),1800);
}
load();
</script>
</body>
</html>
